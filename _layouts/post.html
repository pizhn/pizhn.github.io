---
layout: default
---

<article class="home-section">
  <div class="post-nav">
    <a class="post-back" href="{{ "/" | relative_url }}" aria-label="Back to homepage">← Back</a>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  </div>
  <h1 class="post-title">{{ page.title | escape }}</h1>
  <p class="post-author">by {{ page.author | default: site.author | escape }}</p>

  <div class="post-body">
    {{ content }}
  </div>
</article>
